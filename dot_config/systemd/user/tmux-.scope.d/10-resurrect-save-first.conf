# Применяется ко всем tmux-*.scope: tmux-server.scope (сервер, его создаёт
# ~/.local/bin/home-tmux.sh) и tmux-spawn-*.scope (панели, их создаёт сам tmux).
# Before= значит, что при выключении эти scope'ы гасятся ПОСЛЕ остановки
# tmux-resurrect-save.service — т.е. когда финальное сохранение уже сделано.
[Unit]
Before=tmux-resurrect-save.service
