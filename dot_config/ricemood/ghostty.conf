# ricemood template -> ~/.config/ghostty/themes/ricemood
# Regenerate:  ricemood -a
#
# Palette source: current wallpaper.
# @V  vibrant      @LV light vibrant   @DV dark vibrant
# @M  muted        @LM light muted     @DM dark muted

# The neutrals ride on the sky, not the sand: @LM rotated off cyan toward blue
# and heavily desaturated. Sand stays an accent (yellow, cursor), not the base.
background = ^r@LM>ro(28)>de(0.55)>l(8)^
foreground = ^r@LM>ro(28)>de(0.62)>l(87)^

cursor-color = ^r@V>l(70)^
cursor-text = ^r@LM>ro(28)>de(0.55)>l(8)^

selection-background = ^r@LM>ro(28)>de(0.32)>l(26)^
selection-foreground = ^r@LM>ro(28)>de(0.62)>l(92)^

# black
palette = 0=^r@LM>ro(28)>de(0.45)>l(20)^
palette = 8=^r@LM>ro(28)>de(0.4)>l(38)^

# red - terracotta, the flag and the child's dress
palette = 1=^r@V>ro(-24)>sa(0.35)>l(58)^
palette = 9=^r@V>ro(-24)>sa(0.45)>l(70)^

# green - the sea along the shoreline
palette = 2=^r@V>ro(88)>de(0.52)>l(47)^
palette = 10=^r@V>ro(88)>de(0.42)>l(62)^

# yellow - the sand itself; saturated up so it reads gold rather than mud
palette = 3=^r@V>sa(0.25)>l(62)^
palette = 11=^r@V>sa(0.3)>l(75)^

# blue - the dresses and parasols
palette = 4=^r@LM>ro(32)>sa(0.45)>l(54)^
palette = 12=^r@LM>ro(32)>sa(0.3)>l(68)^

# magenta - the violet in the cloud shadows
palette = 5=^r@LM>ro(74)>de(0.42)>l(62)^
palette = 13=^r@LM>ro(74)>de(0.32)>l(75)^

# cyan - open sky
palette = 6=^r@LM>l(60)^
palette = 14=^r@LM>l(74)^

# white
palette = 7=^r@LM>ro(28)>de(0.55)>l(81)^
palette = 15=^r@LM>ro(28)>de(0.62)>l(95)^
