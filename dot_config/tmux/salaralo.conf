# SalarAlo colors only; keybindings and session settings remain in tmux.conf.
set-option -s theme dark
set-option -g status-style 'fg=#a6a6a6,bg=#080808'
set-option -g status-left-style 'fg=#8a8a8a,bg=#080808'
set-option -g status-right-style 'fg=#8a8a8a,bg=#080808'
set-option -gw window-status-style 'fg=#686868,bg=#080808'
set-option -gw window-status-current-style 'fg=#e0e0e0,bg=#1a1a1a,bold'
set-option -gw window-style 'fg=#a6a6a6,bg=#080808'
set-option -gw window-active-style 'fg=#a6a6a6,bg=#080808'
set-option -gw pane-border-style 'fg=#3a3a3a'
set-option -gw pane-active-border-style 'fg=#c4c4c4'
set-option -s dark-theme-black '#080808'
set-option -s dark-theme-white '#e0e0e0'
set-option -s dark-theme-light-grey '#a6a6a6'
set-option -s dark-theme-dark-grey '#1a1a1a'
set-option -s dark-theme-green '#a6a6a6'
set-option -s dark-theme-yellow '#c4c4c4'
set-option -s dark-theme-red '#e0e0e0'
set-option -s dark-theme-blue '#b8b8b8'
set-option -s dark-theme-cyan '#c0c0c0'
set-option -s dark-theme-magenta '#d0d0d0'
