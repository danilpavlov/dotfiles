set -s escape-time 0
unbind C-b
set-option -g prefix C-b
bind-key C-b send-prefix
bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1

# set-option remain-on-exit on
set -g renumber-windows on   # renumber all windows when any window is closed
set -g escape-time 0         # zero-out escape time delay
set-window-option -g mode-keys vi

# mouse: выделение, скролл, ресайз панелей
set -g mouse on

# copy-mode -> системный буфер Wayland (wl-copy)
# v — начать выделение, y / Enter — копировать, отпускание мыши — копировать
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
# вставка из буфера tmux: префикс + p или префикс + Ctrl-v
bind p   paste-buffer
bind C-v paste-buffer

# style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=color7 bg=default'
set -g status-right '%H:%M'
# set -g status-right ' #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
# set -g status-right ''
set -g status-left '#S'
set -g status-left-style 'fg=color8'
set -g status-right-style 'fg=color8'
set -g status-right-length 20
set -g status-left-length 100
setw -g window-status-current-style 'fg=colour6 bg=default bold'
setw -g window-status-current-format '#I:#W '
setw -g window-status-style 'fg=color8'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D

bind-key -r h swap-window -t -1\; select-window -t -1
bind-key -r l swap-window -t +1\; select-window -t +1
