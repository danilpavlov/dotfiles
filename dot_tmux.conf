# ── Скролл и чтение логов ─────────────────────────────────────────
# vi-режим в copy-mode: Ctrl-u/d, g/G, /поиск, n/N и т.д.
setw -g mode-keys vi

# Больше истории, чтобы логи не обрезались
set -g history-limit 50000

# Выключить мышь полностью (скролл колёсиком, выделение, ресайз панелей)
set -g mouse off

# Быстрый вход в copy-mode по Alt-Up
bind -n M-Up copy-mode

# Привычные vim-биндинги выделения/копирования внутри copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# SalarAlo appearance.
source-file ~/.config/tmux/salaralo.conf
