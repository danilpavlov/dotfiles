# ricemood template -> ~/.local/share/posting/themes/ricemood.yaml
# Regenerate:  ricemood -a     (edit this file, not the generated one)
#
# Same palette and semantics as the nvim / ghostty / k9s themes: cool
# blue-grey neutrals from the sky, sand kept as the one warm accent,
# terracotta/sage/violet picked out of the figures and clouds.
# `background` has to stay a real colour (Textual derives its shades from it)
# and has to equal the ghostty background: ~/.config/posting/posting-transparent
# leaves every cell of exactly that colour to the terminal, which is how the
# ghostty background-opacity shows through, like nvim's transparent mode.
#
# @V vibrant   @LV light vibrant   @DV dark vibrant
# @M muted     @LM light muted     @DM dark muted
#
# Hex values must stay quoted: a bare #RRGGBB is a YAML comment.
# The palette keys below are not posting settings; posting ignores them and
# they only exist to be aliased. Compound styles ("bold X on Y") cannot use
# aliases, so those repeat the expression inline.

# neutrals
bg: &bg "#121417"
bg_alt: &bg_alt "#1A1E23"
bg_high: &bg_high "#23292F"
gutter: &gutter "#495664"
fg_dim: &fg_dim "#8D9EAF"

# accents
sand: &sand "#CDB184"
sand_hi: &sand_hi "#DECAAB"
terra: &terra "#CC8470"
sage: &sage "#84AE88"
blue: &blue "#8EA8CD"
blue_dim: &blue_dim "#6588B9"
violet: &violet "#B1A9C6"
cyan: &cyan "#9FC4C6"

name: ricemood
dark: true

# blue carries the chrome (header, scrollbars, buttons), like the k9s titles;
# sand marks focus and the active tab, like the k9s command prompt.
primary: *blue
secondary: *violet
accent: *sand
background: *bg
# nvim's float background and cursorline, in that order
surface: *bg_alt
panel: *bg_high
warning: *sand_hi
error: *terra
success: *sage

# nvim: LineNr, Cursor, CursorLine, CursorLineNr, MatchParen, Visual
text_area:
  gutter: *gutter
  cursor: "#121417 on #DADEE1"
  cursor_line: "on #23292F"
  cursor_line_gutter: "bold #CDB184 on #23292F"
  matched_bracket: "bold #DECAAB"
  selection: "on #35424F"

# @property blue, strings sage, numbers and constants terra, as in nvim
syntax:
  json_key: *blue
  json_string: *sage
  json_number: *terra
  json_boolean: *terra
  json_null: "italic #CC8470"

url:
  base: *blue
  protocol: *violet
  separator: *fg_dim

# $VARS in the URL bar and inputs: cyan like nvim's macros, terra when the
# name does not resolve
variable:
  resolved: *cyan
  unresolved: *terra

method:
  get: *blue
  post: *sage
  put: *sand
  delete: *terra
  patch: *cyan
  options: *violet
  head: *blue_dim

